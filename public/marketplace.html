<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VANT · Mentorias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--carbon:#090A0C;--graphite:#17191D;--cloud:#F7F8FA;--steel:#9EA4AD;--amber:#FFB000;--orange:#FF7A00;--flame:#FF5A00;--grad:linear-gradient(135deg,#FFB000,#FF5A00);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--carbon);color:var(--cloud);font-family:Inter,system-ui,sans-serif;line-height:1.5;min-height:100vh;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,.card:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:28px;padding:14px 4vw;background:linear-gradient(var(--carbon),rgba(9,10,12,.85));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand svg{height:22px;width:auto}.brand span{color:var(--steel);font-weight:500}
nav{display:flex;gap:6px}
nav button{background:none;padding:8px 14px;border-radius:99px;color:var(--steel);font-weight:500}
nav button[aria-current=true]{background:var(--graphite);color:var(--cloud)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--steel);font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:var(--carbon);font-weight:700}
.hero{position:relative;min-height:68vh;padding:8vh 4vw 6vh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:linear-gradient(90deg,var(--carbon) 30%,transparent),linear-gradient(0deg,var(--carbon),transparent 40%),radial-gradient(circle at 80% 30%,rgba(255,90,0,.28),transparent 55%),var(--graphite)}
.hero .sym{position:absolute;right:-4vw;top:6vh;width:min(62vw,760px);opacity:.9;z-index:0}
.hero>*:not(.sym){position:relative;z-index:1}
.tag{display:inline-block;align-self:flex-start;background:var(--grad);color:var(--carbon);font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px;margin-bottom:16px}
.hero h1{font-size:clamp(40px,7vw,84px);line-height:1;letter-spacing:-.035em;margin:0 0 16px;max-width:12ch;font-weight:800}
.hero p{max-width:46ch;color:#d4d8de;font-size:18px;margin:0 0 24px}
.meta{color:var(--steel);font-size:14px;margin-bottom:20px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:13px 26px;border-radius:10px;font-weight:700;font-size:16px}
.btn.p{background:var(--grad);color:var(--carbon)}.btn.p:hover{filter:brightness(1.1)}
.btn.s{background:rgba(247,248,250,.14);color:var(--cloud)}.btn.s:hover{background:rgba(247,248,250,.22)}
main{padding:0 0 60px}
.row{margin-top:30px}
.row h2{font-size:21px;margin:0 4vw 12px;letter-spacing:-.01em}
.track{display:flex;gap:14px;overflow-x:auto;padding:6px 4vw 14px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--graphite) transparent}
.card{flex:0 0 clamp(220px,22vw,300px);scroll-snap-align:start;background:var(--graphite);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left;padding:0;display:block}
.card:hover{transform:scale(1.05);box-shadow:0 12px 30px rgba(0,0,0,.6);z-index:2}
.cover{position:relative;aspect-ratio:16/10;background:radial-gradient(circle at 85% 0,var(--c1),transparent 60%),#101216;padding:14px;display:flex;flex-direction:column;justify-content:flex-end}
.cover::before{content:"";position:absolute;right:-8%;top:8%;width:62%;aspect-ratio:1;background:var(--grad);opacity:var(--o,.9);clip-path:polygon(50% 0,100% 100%,0 100%,50% 100%,50% 100%);}
.cover::after{content:"";position:absolute;right:calc(-8% + 17%);top:calc(8% + 35%);width:28%;aspect-ratio:1.15;background:#101216;clip-path:polygon(50% 0,100% 100%,0 100%)}
.cover b{position:relative;z-index:1;font-size:18px;line-height:1.15;letter-spacing:-.02em;max-width:11ch}
.badge{position:absolute;left:12px;top:12px;z-index:1;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(9,10,12,.75)}
.badge.own{background:var(--cloud);color:var(--carbon)}
.info{padding:10px 14px 14px;display:flex;justify-content:space-between;font-size:13px;color:var(--steel)}
.info strong{color:var(--cloud)}
.prog{height:3px;background:#2a2d33}.prog i{display:block;height:100%;background:var(--grad)}
.empty{margin:20px 4vw;padding:40px;border:1px dashed #33363c;border-radius:12px;color:var(--steel);text-align:center}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:none;overflow-y:auto;padding:4vh 16px}
.ov.on{display:block}
.modal{max-width:860px;margin:0 auto;background:var(--graphite);border-radius:16px;overflow:hidden;animation:up .25s ease}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.m-top{position:relative;height:230px}.m-top .cover{height:100%;aspect-ratio:auto;padding:24px}.m-top .cover b{font-size:32px;max-width:14ch}
.x{position:absolute;right:14px;top:14px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(9,10,12,.8);font-size:18px}
.m-body{padding:24px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px}
.m-body h3{margin:0 0 10px;font-size:16px}
.m-body p{color:#c6cbd2;margin:0 0 14px;max-width:60ch}
.les{list-style:none;margin:0;padding:0}
.les li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #26292f;font-size:14px}
.les span{color:var(--steel);white-space:nowrap}
.buy{background:var(--carbon);border-radius:12px;padding:18px;align-self:start}
.price{font-size:34px;font-weight:800;letter-spacing:-.03em}.price small{font-size:14px;color:var(--steel);font-weight:500}
.buy ul{padding-left:18px;color:#c6cbd2;font-size:14px;margin:12px 0 16px}
.buy .btn{width:100%;margin-bottom:8px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pay button{background:var(--graphite);border:1px solid #33363c;border-radius:10px;padding:12px;font-weight:600}
.pay button[aria-pressed=true]{border-color:var(--orange);background:rgba(255,122,0,.12)}
.player{position:fixed;inset:0;z-index:60;background:var(--carbon);display:none;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr}
.player.on{display:grid}
.p-bar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #1f2227}
.p-bar button{background:var(--graphite);border-radius:8px;padding:8px 14px}
.stage{padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.screen{position:relative;aspect-ratio:16/9;background:radial-gradient(circle at 70% 30%,rgba(255,90,0,.35),transparent 60%),#101216;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.screen svg{position:absolute;right:6%;top:12%;width:34%;opacity:.25}
.play{width:78px;height:78px;border-radius:50%;background:var(--grad);color:var(--carbon);font-size:28px;z-index:1}
.seek{height:5px;background:#2a2d33;border-radius:9px;overflow:hidden}.seek i{display:block;height:100%;width:0;background:var(--grad);transition:width 6s linear}
.stage h2{margin:0;font-size:24px;letter-spacing:-.02em}.stage p{margin:0;color:var(--steel)}
.side{border-left:1px solid #1f2227;overflow-y:auto;padding:16px}
.side h3{margin:0 0 10px;font-size:15px}
.ls{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;padding:12px;border-radius:10px;margin-bottom:4px}
.ls:hover{background:var(--graphite)}.ls[aria-current=true]{background:var(--graphite);box-shadow:inset 3px 0 var(--orange)}
.ls .n{width:28px;height:28px;border-radius:50%;background:#26292f;display:grid;place-items:center;font-size:12px;flex:none}
.ls.done .n{background:var(--orange);color:var(--carbon)}
.ls small{display:block;color:var(--steel)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--cloud);color:var(--carbon);font-weight:600;padding:12px 20px;border-radius:10px;opacity:0;transition:.3s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{padding:30px 4vw;color:var(--steel);font-size:13px;border-top:1px solid #1a1c20;margin-top:40px}
@media(max-width:760px){.m-body{grid-template-columns:1fr}.player{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}.side{border-left:0;border-top:1px solid #1f2227}.me span{display:none}header{gap:12px}.hero .sym{opacity:.35}}
body.auth header,body.auth .hero,body.auth main,body.auth footer{display:none!important}
body:not(.auth) #login{display:none}
#co,#acc{display:none}
body[data-page=co] #co,body[data-page=acc] #acc{display:block}
body[data-page=co] .hero,body[data-page=co] main,body[data-page=co] footer,body[data-page=acc] .hero,body[data-page=acc] main,body[data-page=acc] footer,body[data-page=co] header{display:none!important}
.cover::before{content:"";position:absolute;inset:0;right:auto;top:0;width:auto;aspect-ratio:auto;clip-path:none;opacity:1;background:linear-gradient(90deg,rgba(9,10,12,.92) 18%,transparent 72%);z-index:1}
.cover::after{display:none}
.pt{position:absolute;right:0;bottom:0;height:100%;width:70%;z-index:0}
.cover b,.badge{z-index:2}.cover b{max-width:10ch}.m-top .cover b{max-width:14ch}
.info{gap:10px}.info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .hero-pt{position:absolute;right:3vw;bottom:0;height:94%;width:min(44vw,600px);z-index:0}.hero-pt .pt{width:100%;height:100%}
.screen .pt{top:auto;right:3%;width:46%;height:94%;opacity:1}
.fld{display:block;margin-bottom:14px;font-size:14px;color:var(--steel)}
.fld input,.fld select{display:block;width:100%;margin-top:6px;background:var(--graphite);border:1px solid #2c2f35;border-radius:10px;padding:13px 14px;color:var(--cloud);font:inherit;font-size:16px}
.fld input:focus,.fld select:focus{outline:2px solid var(--orange);border-color:transparent}
.pw2{position:relative}.pw2 button{position:absolute;right:8px;bottom:8px;background:none;color:var(--steel);padding:6px 10px;font-size:13px}
.err{color:#ff8a65;font-size:14px;min-height:20px;margin:0 0 8px}
.lk{background:none;color:var(--amber);font-weight:600;padding:0}
.or{display:flex;align-items:center;gap:12px;color:var(--steel);font-size:13px;margin:16px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:#2a2d33}
.full{width:100%}
.co-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 4vw;border-bottom:1px solid #1a1c20}.sec{color:var(--steel);font-size:14px}
.co-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;max-width:1080px;margin:0 auto;padding:30px 4vw 60px;align-items:start}
.box{background:var(--graphite);border-radius:16px;padding:22px;margin-bottom:18px}.box h2{font-size:18px;margin:0 0 16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.pay3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pay3 button{background:var(--carbon);border:1px solid #33363c;border-radius:10px;padding:12px;font-weight:600}.pay3 button[aria-pressed=true]{border-color:var(--orange);background:rgba(255,122,0,.12)}
.qr{width:170px;height:170px;border-radius:10px;display:block}
.pix{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.pix p{color:#c6cbd2;font-size:14px;max-width:34ch;margin:0 0 12px}
.code{display:flex;gap:8px}.code input{flex:1;min-width:0;background:var(--carbon);border:1px solid #2c2f35;border-radius:8px;color:var(--steel);padding:10px;font:inherit;font-size:13px}.code button{background:var(--carbon);border-radius:8px;padding:10px 14px;font-weight:600}
.sum{position:sticky;top:20px}
.ord{display:flex;gap:14px;margin-bottom:16px}.ord small{display:block;color:var(--steel)}
.th{position:relative;flex:none;width:96px;height:72px;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 85% 0,#FF7A0066,transparent 60%),#101216}.th .pt{width:100%}
.bump{display:flex;gap:10px;align-items:flex-start;border:1px dashed #4a3a2a;background:rgba(255,176,0,.06);border-radius:10px;padding:12px;margin-bottom:14px;cursor:pointer;font-size:14px}.bump small{display:block;color:var(--steel)}.bump input{accent-color:var(--orange);margin-top:4px}
.cp{display:flex;gap:8px;margin-bottom:14px}.cp input{flex:1;min-width:0;background:var(--carbon);border:1px solid #2c2f35;border-radius:8px;color:var(--cloud);padding:10px;font:inherit}.cp button{background:var(--carbon);border-radius:8px;padding:10px 14px;font-weight:600}.cp.ok{justify-content:space-between;align-items:center;color:var(--amber);font-size:14px}
dl.t{margin:0 0 16px;font-size:14px;color:#c6cbd2}dl.t div{display:flex;justify-content:space-between;padding:5px 0}dl.t .tot{border-top:1px solid #2a2d33;margin-top:6px;padding-top:12px;font-size:20px;font-weight:800;color:var(--cloud)}
.fine{color:var(--steel);font-size:13px;text-align:center;margin:10px 0 0}
.ok-v{max-width:520px;margin:10vh auto;padding:0 20px;text-align:center}.chk{width:84px;height:84px;margin:0 auto 20px;border-radius:50%;background:var(--grad);color:var(--carbon);font-size:42px;display:grid;place-items:center;animation:up .4s}
.ok-v h1{font-size:34px;letter-spacing:-.03em;margin:0 0 8px}.ok-v p{color:var(--steel)}.ok-v .btns{justify-content:center;margin-top:22px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #0006;border-top-color:var(--carbon);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes sp{to{transform:rotate(360deg)}}
.pw{position:relative}.pbtn{display:flex;align-items:center;gap:8px;background:none;padding:4px 10px 4px 4px;border-radius:99px;color:var(--cloud)}.pbtn:hover{background:var(--graphite)}
.pmenu{position:absolute;right:0;top:calc(100% + 10px);width:310px;background:var(--graphite);border:1px solid #2a2d33;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.7);padding:8px;z-index:30}.pmenu[hidden]{display:none}
.ph{display:flex;gap:12px;align-items:center;padding:12px}.ph .avatar{width:46px;height:46px;font-size:18px}.ph small{display:block;color:var(--steel);font-size:13px}
.plan{display:inline-block;background:rgba(255,176,0,.15);color:var(--amber);font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:4px}
.ps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 8px 10px}.ps div{background:var(--carbon);border-radius:10px;padding:10px;text-align:center}.ps b{display:block;font-size:18px}.ps small{color:var(--steel);font-size:12px}
.pmenu hr{border:0;border-top:1px solid #2a2d33;margin:6px 4px}
.pi{display:flex;justify-content:space-between;width:100%;background:none;padding:11px 12px;border-radius:10px;text-align:left}.pi:hover{background:var(--carbon)}.pi small{color:var(--steel)}.pi.out{color:#ff8a65}
.acc{max-width:900px;margin:0 auto;padding:30px 4vw 60px}
.ah{display:flex;gap:18px;align-items:center;margin-bottom:24px}.ah .avatar{width:72px;height:72px;font-size:30px}.ah h1{margin:0;font-size:28px;letter-spacing:-.02em}.ah p{margin:0;color:var(--steel)}
.tabs{display:flex;gap:6px;border-bottom:1px solid #1f2227;margin-bottom:22px}.tabs button{background:none;padding:10px 14px;color:var(--steel);font-weight:600;border-bottom:2px solid transparent}.tabs button[aria-selected=true]{color:var(--cloud);border-color:var(--orange)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.st div{background:var(--graphite);border-radius:12px;padding:16px}.st b{font-size:28px;letter-spacing:-.03em;display:block}.st small{color:var(--steel)}
.ord-i{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--graphite);border-radius:12px;padding:14px 16px;margin-bottom:10px}.ord-i small{display:block;color:var(--steel)}.ord-i button{background:var(--carbon);border-radius:8px;padding:8px 12px;margin-left:10px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--graphite);border-radius:12px;padding:14px 16px;margin-bottom:10px}.tg small{display:block;color:var(--steel)}
.sw{width:46px;height:26px;border-radius:99px;background:#33363c;position:relative;flex:none;padding:0}.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--cloud);transition:.2s}.sw[aria-checked=true]{background:var(--orange)}.sw[aria-checked=true]::after{left:23px}

#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--carbon);overflow:hidden auto;padding:90px 16px 70px}
#login::before{content:"";position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(9,10,12,.92),rgba(9,10,12,.5) 38%,rgba(9,10,12,.96)),radial-gradient(circle at 50% 45%,transparent 25%,rgba(9,10,12,.7))}
.lg-bg{position:fixed;inset:-15% -10%;z-index:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;transform:rotate(-7deg);opacity:.7}
.tile{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 80% 10%,var(--c1),transparent 65%),#101216}.tile .pt{width:100%;height:80%}
.lg-top{position:fixed;left:0;right:0;top:0;z-index:3;padding:22px 4vw}.lg-top .brand{font-size:26px}.lg-top svg{height:30px!important}
.lg-card{position:relative;z-index:2;width:min(440px,100%);background:rgba(9,10,12,.78);backdrop-filter:blur(14px);border:1px solid rgba(247,248,250,.08);border-radius:20px;padding:44px clamp(24px,5vw,52px) 36px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:up .6s ease}

.lg-top .logo{height:38px}.p-bar .logo{height:22px}.co-top .logo{height:28px}
header{position:fixed;left:0;right:0;background:linear-gradient(rgba(9,10,12,.9),transparent);backdrop-filter:none;gap:22px;transition:background .3s}
header.sol{background:var(--carbon)}
nav button{background:none;border-radius:0;padding:6px 8px;font-size:14px;color:#d4d8de}nav button[aria-current=true]{background:none;color:var(--cloud);font-weight:700}
.srch{margin-left:auto;display:flex;align-items:center;border:1px solid transparent;border-radius:6px;transition:.2s}.srch button{background:none;padding:6px 10px;font-size:20px;transform:scaleX(-1)}
.srch input{width:0;opacity:0;background:none;border:0;color:var(--cloud);font:inherit;padding:0;transition:width .25s}
.srch.on{border-color:#6b6f78;background:rgba(9,10,12,.75)}.srch.on input{width:min(240px,46vw);opacity:1;padding:7px 4px;outline:0}
.me{margin-left:0}
.hero{min-height:90vh;padding:16vh 4vw 13vh;background:linear-gradient(90deg,var(--carbon) 24%,transparent 70%),linear-gradient(0deg,var(--carbon) 3%,transparent 36%),radial-gradient(circle at 78% 35%,rgba(255,90,0,.4),transparent 55%),var(--graphite)}
.hero h1{font-size:clamp(46px,8vw,104px);line-height:.95;letter-spacing:-.04em;max-width:11ch;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.hero p{font-size:19px;max-width:46ch}
.kick{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--steel);font-size:15px;margin-bottom:12px}
.tri{width:16px;height:14px;background:var(--grad);clip-path:polygon(50% 0,100% 100%,0 100%)}
.meta2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;font-size:15px;color:#d4d8de}.score{color:var(--amber)}
.box{border:1px solid #6b6f78;padding:1px 7px;border-radius:3px;font-size:13px;color:#d4d8de}
.hero .btn{padding:12px 28px;font-size:18px;border-radius:6px}
.hero+main{margin-top:-10vh;position:relative;z-index:2}
body[data-v=lib] main,body[data-v=search] main{margin-top:0!important;padding-top:84px}
.rs{display:flex;align-items:center;gap:20px;margin:0 4vw 18px;padding:16px 20px;border-radius:12px;background:linear-gradient(90deg,rgba(255,122,0,.18),rgba(23,25,29,.92) 60%);border:1px solid rgba(255,122,0,.28)}
.rs small{display:block;color:var(--steel)}.rsb{flex:1;height:6px;background:#2a2d33;border-radius:9px;overflow:hidden;min-width:80px}.rsb i{display:block;height:100%;background:var(--grad)}
.rs strong{font-size:30px;letter-spacing:-.03em}.rs strong small{display:inline;font-size:14px}.rs .btn{padding:10px 16px;font-size:14px}
.card{flex:0 0 clamp(230px,21vw,300px);background:none;border-radius:6px;overflow:visible;position:relative;cursor:pointer;transition:transform .25s ease .12s}
.card:hover,.card:focus-visible{transform:scale(1.2);z-index:5;box-shadow:none}
.card .cover{aspect-ratio:16/9;border-radius:6px;padding:12px}.card:hover .cover,.card:focus-visible .cover{border-radius:6px 6px 0 0}
.card .cover b{font-size:16px;max-width:12ch}
.card .prog{position:absolute;left:0;right:0;bottom:0;height:4px;z-index:3}
.pop{display:none;position:absolute;top:100%;left:0;right:0;background:var(--graphite);border-radius:0 0 6px 6px;padding:12px 12px 14px;box-shadow:0 18px 36px rgba(0,0,0,.7)}
.card:hover .pop,.card:focus-visible .pop,.card:focus-within .pop{display:block}
.pb{display:flex;align-items:center;gap:8px;margin-bottom:8px}.pb strong{margin-left:auto;font-size:14px}
.rb{width:32px;height:32px;border-radius:50%;background:rgba(247,248,250,.12);border:1px solid #6b6f78;font-size:13px;display:grid;place-items:center;padding:0}.rb.p{background:var(--cloud);color:var(--carbon);border-color:var(--cloud)}
.pm{font-size:12px;color:var(--steel);margin-top:4px}.pm .box{font-size:11px}
.track{padding:34px 4vw 120px;margin:-34px 0 -96px}
.row{margin-top:0}.row h2{font-size:22px;margin:14px 4vw 0;position:relative;z-index:1}
.tp{flex:0 0 auto;display:flex;align-items:flex-end;scroll-snap-align:start}
.num{font-size:clamp(120px,15vw,180px);font-weight:800;line-height:.76;letter-spacing:-.09em;color:#0b0c0e;-webkit-text-stroke:3px #5b5f68;margin-right:-10px;padding-left:6px;position:relative;z-index:0}
.tp:first-child .num{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0}
.tp .card{flex:0 0 clamp(120px,11vw,160px);z-index:1}.tp .card .cover{aspect-ratio:2/3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 14px;padding:10px 4vw 140px}.grid .card{flex:none}
.acc{padding-top:96px}
@media(max-width:760px){.hero{min-height:80vh;padding-top:13vh}.rs{flex-wrap:wrap}.num{font-size:110px}.srch.on input{width:36vw}header{gap:8px}nav button{padding:6px 5px}}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:rgba(23,25,29,.9);border:1px solid #2c2f35;border-radius:99px;padding:4px;margin-bottom:26px;isolation:isolate}
.seg .thumb{position:absolute;z-index:-1;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:var(--grad);box-shadow:0 4px 18px rgba(255,90,0,.4);transition:transform .45s cubic-bezier(.65,-.2,.3,1.25)}
.seg[data-role=admin] .thumb{transform:translateX(100%)}
.seg button{background:none;padding:11px 6px;border-radius:99px;font-weight:700;font-size:14px;color:var(--steel);transition:color .3s}.seg button[aria-selected=true]{color:var(--carbon)}
#login[data-role=admin] .lg-card{border-color:rgba(255,122,0,.5);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(255,90,0,.2)}
.fld textarea{display:block;width:100%;margin-top:6px;background:var(--graphite);border:1px solid #2c2f35;border-radius:10px;padding:13px 14px;color:var(--cloud);font:inherit;resize:vertical}
.btn.dng{color:#ff8a65}#bk{display:none;position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.6)}body.prev #bk{display:block}
.ft{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;margin-right:6px;background:#26292f;color:var(--amber)}.ft.doc{color:#7db4ff}.ft.link{color:#8ee0a4}
.dlb{background:var(--carbon);border:1px solid #33363c;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}.dlb:hover{border-color:var(--orange)}
#adm{display:none;position:fixed;inset:0;z-index:95;background:var(--carbon);overflow-y:auto;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}body.adm #adm{display:block}
#adm::before{content:"";position:absolute;inset:0 0 auto;height:420px;background:radial-gradient(60% 100% at 85% 0,rgba(255,90,0,.16),transparent 70%);pointer-events:none}
.a-hd{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:calc(12px + env(safe-area-inset-top,0px)) 4vw 12px;background:rgba(9,10,12,.82);backdrop-filter:blur(14px);border-bottom:1px solid #16181c}
.a-hd .logo{height:26px}
.a-pill{background:var(--grad);color:var(--carbon);font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 9px;border-radius:99px}
.a-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.a-nav button{background:none;padding:8px 14px;font-size:14px;font-weight:600;color:var(--steel);white-space:nowrap;border-radius:99px}.a-nav button:hover{color:var(--cloud)}.a-nav button[aria-current=true]{background:var(--graphite);color:var(--cloud)}
.a-r2{margin-left:auto;display:flex;align-items:center;gap:10px}.a-r2>.btn{padding:9px 16px;font-size:14px;border-radius:99px}
.a-pg{position:relative;max-width:1180px;margin:0 auto;padding:34px 4vw 0}
.a-ttl{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}.a-ttl h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;margin:0 0 4px}.a-ttl p{margin:0;color:var(--steel)}.a-ttl .btn{padding:11px 20px;border-radius:99px}.a-ttl .btns{display:flex;gap:10px}
.a-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.a-k{position:relative;background:var(--graphite);border:1px solid #23262b;border-radius:16px;padding:18px 20px;overflow:hidden}.a-k::before{content:"";position:absolute;left:0;top:0;height:3px;width:44px;background:var(--grad)}
.a-k small{color:var(--steel)}.a-k b{display:block;font-size:32px;letter-spacing:-.03em;margin:2px 0}.a-k em{font-style:normal;color:#7b818b;font-size:13px}
.a-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.a-pn{background:var(--graphite);border:1px solid #23262b;border-radius:16px;padding:20px 22px;margin-bottom:14px}.a-cols .a-pn{margin:0}.a-pn h3{margin:0 0 16px;font-size:16px}

.rk{width:22px;height:22px;border-radius:50%;background:#272a30;color:var(--steel);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}.rk.f{background:var(--grad);color:var(--carbon)}

.a-x{background:var(--carbon);border-radius:8px;width:30px;height:30px;flex:none;color:var(--steel)}.a-x:hover{color:#ff8a65}
.a-sh{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px}.a-sh h2{margin:0;font-size:22px;letter-spacing:-.02em}
.a-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.a-card{background:var(--graphite);border:1px solid #23262b;border-radius:14px;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}.a-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.55);border-color:#3a3d44}
.a-card .cover{aspect-ratio:16/9;padding:12px;border-radius:0}.a-card .cover b{font-size:16px}
.a-tag{position:absolute;z-index:3;right:10px;top:10px;border:0;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;background:rgba(9,10,12,.8);cursor:pointer}.a-tag.ok{color:var(--amber)}.a-tag.dr{color:var(--steel)}

.a-new{min-height:250px;border:1.5px dashed #4a3a2a;border-radius:14px;background:rgba(255,176,0,.04);color:var(--amber);font-size:34px;display:grid;place-items:center;align-content:center;transition:.2s}.a-new:hover{background:rgba(255,176,0,.09);border-color:var(--amber)}.a-new span{font-size:15px;font-weight:600}
.a-sec{background:var(--graphite);border:1px solid #23262b;border-radius:16px;padding:22px;margin-bottom:14px}.a-sec .fld input,.a-sec .fld select,.a-sec .fld textarea{background:var(--carbon)}.a-sec h3{margin:0 0 14px;font-size:16px}
.a-prow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #26292f}.a-prow:first-of-type{border:0}
.a-pr{display:flex;align-items:center;gap:6px;color:var(--steel)}.a-pr input{width:110px;background:var(--carbon);border:1px solid #2c2f35;border-radius:8px;padding:10px;color:var(--cloud);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chips button{background:var(--graphite);border:1px solid #2c2f35;border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--steel)}.chips button[aria-pressed=true]{border-color:var(--orange);background:rgba(255,122,0,.12);color:var(--cloud)}
.a-2c{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}.a-2c aside{position:sticky;top:84px}
.a-step{display:flex;align-items:center;gap:10px;font-weight:700;margin:4px 0 12px}.a-step b{width:24px;height:24px;border-radius:50%;background:var(--grad);color:var(--carbon);display:grid;place-items:center;font-size:12px}.a-step:not(:first-child){margin-top:26px}
.a-pick{display:grid;gap:8px;max-height:250px;overflow-y:auto;padding-right:4px;scrollbar-width:thin}
.a-pk{display:flex;align-items:center;gap:12px;text-align:left;background:var(--carbon);border:1px solid #2c2f35;border-radius:12px;padding:8px 12px 8px 8px;transition:.2s}.a-pk:hover{border-color:#4a4e57}.a-pk[aria-pressed=true]{border-color:var(--orange);background:rgba(255,122,0,.1)}.a-pk small{font-size:12px}
.th2{position:relative;flex:none;width:64px;height:42px;border-radius:7px;overflow:hidden;background:radial-gradient(circle at 85% 0,#FF7A0066,transparent 60%),#101216}.th2 .pt{width:100%}
.a-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.a-ty{background:var(--carbon);border:1px solid #2c2f35;border-radius:12px;padding:14px 8px;text-align:center;transition:.2s;font-weight:600}.a-ty i{display:block;font-style:normal;font-size:22px;margin-bottom:4px}.a-ty small{display:block;color:var(--steel);font-size:12px;font-weight:400}.a-ty[aria-pressed=true]{border-color:var(--orange);background:rgba(255,122,0,.1)}
.a-dz{position:relative;display:grid;place-items:center;text-align:center;align-content:center;gap:2px;min-height:110px;border:1.5px dashed #3a3d44;border-radius:12px;background:var(--carbon);padding:16px;color:var(--steel);transition:.2s;margin-bottom:14px}.a-dz:hover,.a-dz.has{border-color:var(--orange);background:rgba(255,122,0,.06)}.a-dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}.a-dz b{color:var(--cloud)}.a-dz.has b{color:var(--amber)}
.a-ok{border:1px solid rgba(255,176,0,.3);background:rgba(255,176,0,.06);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px}
#aov{z-index:120}.a-ed{max-width:980px;position:relative;display:grid;grid-template-columns:1fr 280px}
.a-edh{grid-column:1/-1;padding:22px 26px 16px;border-bottom:1px solid #26292f}.a-edh h2{margin:0 0 14px}
.a-steps{display:flex;gap:6px;flex-wrap:wrap}.a-steps button{display:flex;align-items:center;gap:8px;background:var(--carbon);border:1px solid #2c2f35;border-radius:99px;padding:7px 14px 7px 8px;font-size:14px;font-weight:600;color:var(--steel)}.a-steps b{width:22px;height:22px;border-radius:50%;background:#2a2d33;display:grid;place-items:center;font-size:12px}.a-steps button[aria-current=true]{color:var(--cloud);border-color:var(--orange)}.a-steps button[aria-current=true] b{background:var(--grad);color:var(--carbon)}.a-steps button.done b{background:var(--orange);color:var(--carbon)}
.a-edb{padding:8px 26px 22px;min-width:0}.a-edb h3{margin:18px 0 10px}
.a-pvw{padding:22px 22px 18px 0}.a-pvw .cover{aspect-ratio:16/9;border-radius:10px}.a-pvi{padding:12px 2px;font-size:13px;color:var(--steel)}.a-pvi b{display:block;color:var(--cloud);font-size:15px}
.a-edf{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:16px 26px;border-top:1px solid #26292f}.a-edf .err{flex:1;margin:0;text-align:right}
.a-r{display:flex;align-items:center;gap:8px;margin-bottom:8px}.a-r input{flex:1;min-width:0;background:var(--carbon);border:1px solid #2c2f35;border-radius:8px;padding:10px;color:var(--cloud);font:inherit}.a-r input[type=number]{flex:0 0 70px}.a-r button{background:var(--carbon);border-radius:8px;width:34px;height:34px;flex:none}.a-r .a-vb{width:auto;padding:0 10px;font-size:12px;white-space:nowrap;color:var(--steel)}.a-r .a-vb.on{color:var(--amber)}.a-r .n{width:26px;height:26px;border-radius:50%;background:#26292f;display:grid;place-items:center;font-size:12px;flex:none}.a-r small{color:var(--steel)}.a-r .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:860px){.a-2c,.a-cols{grid-template-columns:1fr}.a-2c aside{position:static}.a-ed{grid-template-columns:1fr}.a-pvw{display:none}}
@media(max-width:760px){.a-hd{flex-wrap:wrap;gap:10px}.a-nav{order:3;width:100%}.a-r2>.btn{display:none}.a-types{grid-template-columns:1fr}.a-bar{grid-template-columns:22px 1fr auto}.a-bar .trk{display:none}}
</style>

<script>
const M=[
{id:1,t:"Revenue Engine",cat:"Operação e processo",c:"#FF7A00",price:1497,top:1,d:"Monte uma operação comercial integrada: aquisição, processo, execução e dados em um único sistema previsível.",L:[["Diagnóstico de maturidade comercial","14 min"],["Desenhando o funil de ponta a ponta","32 min"],["Rotinas e cadência do time","28 min"],["Indicadores que governam a operação","35 min"],["Plano de 90 dias","22 min"]]},
{id:2,t:"Pipeline previsível",cat:"Operação e processo",c:"#FFB000",price:897,d:"Etapas, critérios de avanço e forecast para parar de depender de ação isolada.",L:[["Etapas e critérios de saída","25 min"],["Forecast em planilha e CRM","30 min"],["Revisão semanal de pipeline","18 min"],["Gestão de gargalos","24 min"]]},
{id:3,t:"SDR de alta performance",cat:"Operação e processo",c:"#FF5A00",price:697,d:"Prospecção, qualificação e agendamento com método e script testado.",L:[["Perfil de cliente ideal","20 min"],["Cadência multicanal","27 min"],["Qualificação em 5 perguntas","22 min"],["Rotina diária do SDR","16 min"]]},
{id:4,t:"Outbound B2B do zero",cat:"Aquisição e dados",c:"#FF7A00",price:1197,d:"Do ICP à primeira reunião: listas, mensagens e automação para gerar demanda ativa.",L:[["Montando listas qualificadas","29 min"],["Mensagens que recebem resposta","26 min"],["Automação sem perder personalização","31 min"],["Métricas de outbound","19 min"]]},
{id:5,t:"Dados para vendas",cat:"Aquisição e dados",c:"#FFB000",price:997,top:1,d:"Dashboards simples, números claros e decisões guiadas por indicadores.",L:[["Quais métricas importam","21 min"],["Construindo o painel comercial","34 min"],["Revenue Score na prática","26 min"],["Do dado à decisão","18 min"]]},
{id:6,t:"Tráfego para aquisição B2B",cat:"Aquisição e dados",c:"#FF5A00",price:1097,d:"Mídia paga conectada ao pipeline, não só a cliques.",L:[["Canais e orçamento","23 min"],["Oferta e página","28 min"],["Atribuição até a venda","30 min"],["Otimização semanal","20 min"]]},
{id:7,t:"CRM na prática",cat:"Operação e processo",c:"#FF7A00",price:597,d:"Configure e adote o CRM para que o time use e a liderança confie nos dados.",L:[["Estrutura e campos essenciais","24 min"],["Automações úteis","27 min"],["Adoção pelo time","17 min"]]},
{id:8,t:"Liderança comercial",cat:"Operação e processo",c:"#FFB000",price:1297,d:"Contratação, onboarding, 1:1 e gestão por indicadores.",L:[["Contratar e integrar vendedores","30 min"],["1:1 que muda resultado","22 min"],["Metas e comissionamento","28 min"],["Cultura de execução","19 min"]]}
];
const own=new Set([2]), prog={2:50}, done={2:new Set([0,1])};
let view="home",cur=null,pay="Pix",timer=null;
const $=s=>document.querySelector(s);
const brl=n=>"R$ "+n.toLocaleString("pt-BR");
const dur=m=>{const mins=m.L.reduce((a,l)=>a+parseInt(l[1]),0);return Math.floor(mins/60)+"h"+String(mins%60).padStart(2,"0")};
function card(m){const o=own.has(m.id);
 return `<button class="card" data-id="${m.id}" aria-label="${m.t}"><div class="cover" style="--c1:${m.c}55"><span class="badge ${o?"own":""}">${o?"Na biblioteca":m.cat}</span><b>${m.t}</b></div>${o&&prog[m.id]?`<div class="prog"><i style="width:${prog[m.id]}%"></i></div>`:""}<div class="info"><span>${m.L.length} aulas · ${dur(m)}</span><strong>${o?"Assistir":brl(m.price)}</strong></div></button>`}
const row=(t,a)=>a.length?`<div class="row"><h2>${t}</h2><div class="track">${a.map(card).join("")}</div></div>`:"";
function render(){
 const f=M[0],o=own.has(f.id);
 $("#hero").style.display=view==="home"?"flex":"none";
 $("#hero").innerHTML=`<svg class="sym" viewBox="0 0 198 100" aria-hidden="true"><use href="#sym"/></svg><span class="tag">Mais vendida</span><h1>${f.t}</h1><p>${f.d}</p><div class="meta">${f.L.length} aulas · ${dur(f)} · Certificado incluso</div><div class="btns"><button class="btn p" data-play="${f.id}">▶ ${o?"Continuar":"Assistir prévia grátis"}</button><button class="btn s" data-id="${f.id}">Ver detalhes</button></div>`;
 if(view==="lib"){const a=M.filter(m=>own.has(m.id));
  $("#main").innerHTML=`<div class="row" style="margin-top:34px"><h2>Minha biblioteca</h2></div>`+(a.length?`<div class="track" style="flex-wrap:wrap">${a.map(card).join("")}</div>`:`<div class="empty">Você ainda não tem mentorias. Escolha uma no catálogo e comece hoje.</div>`)}
 else{const a=M.filter(m=>own.has(m.id));
  $("#main").innerHTML=row("Continue assistindo",a)+row("Mais assistidas",M.filter(m=>m.top||m.id<4))+[...new Set(M.map(m=>m.cat))].map(c=>row(c,M.filter(m=>m.cat===c))).join("")}
}
function detail(id){cur=M.find(m=>m.id==id);const m=cur,o=own.has(id);
 $("#ov").innerHTML=`<div class="modal"><div class="m-top"><button class="x" data-close aria-label="Fechar">✕</button><div class="cover" style="--c1:${m.c}66"><b>${m.t}</b></div></div><div class="m-body"><div><h3>Sobre a mentoria</h3><p>${m.d}</p><h3>Conteúdo · ${m.L.length} aulas</h3><ul class="les">${m.L.map((l,i)=>`<li><div>${i+1}. ${l[0]}</div><span>${i===0&&!o?"Prévia grátis":l[1]}</span></li>`).join("")}</ul></div><aside class="buy">${o?`<strong>Você já tem acesso</strong><ul><li>Acesso vitalício</li><li>Certificado ao concluir</li></ul><button class="btn p" data-play="${id}">▶ Assistir agora</button>`:`<div class="price">${brl(m.price)} <small>pagamento único</small></div><ul><li>Acesso vitalício</li><li>Materiais e templates</li><li>Certificado ao concluir</li></ul><button class="btn p" data-checkout>Comprar mentoria</button><button class="btn s" data-play="${id}">Assistir prévia grátis</button>`}</aside></div></div>`;
 $("#ov").classList.add("on")}
function checkout(){const m=cur;
 $("#ov .buy").innerHTML=`<strong>Finalizar compra</strong><div class="price" style="margin-top:6px">${brl(m.price)}</div><div class="pay" role="group" aria-label="Forma de pagamento">${["Pix","Cartão"].map(p=>`<button data-pay="${p}" aria-pressed="${p===pay}">${p}</button>`).join("")}</div><button class="btn p" data-confirm>Confirmar compra</button><button class="btn s" data-back>Voltar</button>`}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2600)}
function player(id,li){cur=M.find(m=>m.id==id);const m=cur,o=own.has(id);
 li=li??(o?Math.min((done[id]||new Set()).size,m.L.length-1):0);
 const l=m.L[li];clearTimeout(timer);
 $("#pl").innerHTML=`<div class="p-bar"><button data-exit>← Voltar</button><div class="brand"><span class="logo" role="img" aria-label="VANT"></span><span>${m.t}</span></div></div><div class="stage"><div class="screen"><svg viewBox="0 0 198 100"><use href="#sym"/></svg><button class="play" data-toggle aria-label="Reproduzir">▶</button></div><div class="seek"><i id="seek"></i></div><h2>${li+1}. ${l[0]}</h2><p>${l[1]} · ${m.t}</p></div><div class="side"><h3>Aulas</h3>${m.L.map((x,i)=>{const lock=!o&&i>0,d=done[id]&&done[id].has(i);return `<button class="ls ${d?"done":""}" data-ls="${i}" aria-current="${i===li}"><span class="n">${lock?"🔒":d?"✓":i+1}</span><span>${x[0]}<small>${lock?"Disponível após a compra":x[1]}</small></span></button>`}).join("")}</div>`;
 $("#pl").dataset.id=id;$("#pl").dataset.li=li;$("#pl").classList.add("on");$("#ov").classList.remove("on")}
document.addEventListener("click",e=>{const t=e.target.closest("button,.card");if(!t)return;const d=t.dataset;
 if(d.v){view=d.v;document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b===t));render();scrollTo(0,0)}
 else if(d.close!==undefined)$("#ov").classList.remove("on");
 else if(d.play)player(d.play);
 else if(d.id)detail(d.id);
 else if(d.checkout!==undefined)checkout();
 else if(d.pay){pay=d.pay;checkout()}
 else if(d.back!==undefined)detail(cur.id);
 else if(d.confirm!==undefined){own.add(cur.id);prog[cur.id]=0;done[cur.id]=new Set();render();detail(cur.id);toast("Compra confirmada. Mentoria liberada na sua biblioteca.")}
 else if(d.exit!==undefined){clearTimeout(timer);$("#pl").classList.remove("on");render()}
 else if(d.ls!==undefined){const id=+$("#pl").dataset.id,i=+d.ls;if(!own.has(id)&&i>0){toast("Compre a mentoria para liberar esta aula.");$("#pl").classList.remove("on");detail(id)}else player(id,i)}
 else if(d.toggle!==undefined){const id=+$("#pl").dataset.id,i=+$("#pl").dataset.li,s=$("#seek");s.style.width="100%";t.textContent="⏸";
  timer=setTimeout(()=>{if(!own.has(id)){toast("Fim da prévia. Compre para continuar.");$("#pl").classList.remove("on");detail(id);return}
   (done[id]=done[id]||new Set()).add(i);getS(id).w+=(parseInt(cur.L[i][1])||0)/60;prog[id]=Math.round(done[id].size/cur.L.length*100);toast("Aula concluída");player(id,Math.min(i+1,cur.L.length-1))},6000)}
});
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")e.target.classList.remove("on")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#ov").classList.remove("on")}});
render();
</script>
<script>
const P={

const apmHTML=()=>`<div class="ph"><span class="avatar">${esc(ADMU.name[0])}</span><div><b>${esc(ADMU.name)}</b><small>${ADM[0]}</small><span class="plan">Administrador</span></div></div><div class="ps"><div><b>${M.length}</b><small>mentorias</small></div><div><b>${nL()}</b><small>aulas</small></div><div><b>${nF()}</b><small>materiais</small></div></div><hr>${[["painel","Painel","Visão geral"],["mentorias","Mentorias",M.length+" no catálogo"],["publicar","Publicar conteúdo",""],["produtos","Produtos e valores",""]].map(x=>`<button class="pi" role="menuitem" data-a="tab" data-t="${x[0]}">${x[1]}<small>${x[2]}</small></button>`).join("")}<hr><button class="pi" role="menuitem" data-a="prev">Ver como aluno<small>Catálogo</small></button><hr><button class="pi out" role="menuitem" data-a="alogout">Sair da conta</button>`;
function admDraw(){const T=[["painel","Painel"],["mentorias","Mentorias"],["publicar","Publicar conteúdo"],["produtos","Produtos e valores"]];if(!fm(pubM)&&M.length)pubM=M[0].id;
 const b=aTab==="painel"?painel():aTab==="mentorias"?mentTab():aTab==="publicar"?pubTab():prodTab();
 $("#adm").innerHTML=`<div class="a-hd"><span class="logo" role="img" aria-label="VANT"></span><span class="a-pill">ADMIN</span><nav class="a-nav" aria-label="Admin">${T.map(t=>`<button data-a="tab" data-t="${t[0]}" aria-current="${aTab===t[0]}">${t[1]}</button>`).join("")}</nav><div class="a-r2"><button class="btn p" data-a="new">＋ Nova mentoria</button><div class="pw"><button class="pbtn" data-a="apm" aria-haspopup="menu" aria-expanded="false" aria-label="Menu do perfil"><span class="avatar">${esc(ADMU.name[0])}</span><span class="pn">${esc(ADMU.name)}</span>▾</button><div class="pmenu" id="apm" role="menu" hidden>${apmHTML()}</div></div></div></div>${b}`}
function openEd(id){const m=id&&fm(id);ed=m?{id:m.id,step:1,t:m.t,cat:m.cat,price:m.price,d:m.d,n:P[m.id].n,r:P[m.id].r,lv:LV[m.id]||"Iniciante",pub:m.pub!==false,L:m.L.map(l=>[l[0],parseInt(l[1])||10,l[2],l[3]]),F:m.F.map(f=>({...f}))}:{id:0,step:1,t:"",cat:"Operação e processo",price:497,d:"",n:"",r:"",lv:"Iniciante",pub:false,L:[["",15]],F:[]};drawEd();$("#aov").classList.add("on")}
function closeEd(){ed=null;$("#aov").classList.remove("on")}
const updPv=()=>{if(!ed)return;const a=$("#epv-t"),b=$("#epv-p"),c=$("#epv-m");if(a)a.textContent=ed.t||"Título da mentoria";if(b)b.textContent=R(+ed.price||0);if(c)c.textContent=(ed.n||"Mentor")+(ed.r?" · "+ed.r:"")};
function drawEd(){const e=ed,st=e.step,nid=e.id||Math.max(0,...M.map(x=>x.id))+1,I=(k,l,x="")=>`<label class="fld">${l}<input data-e="${k}" value="${esc(e[k])}" ${x}></label>`;
 P[0]=Object.assign(mkP(nid),{n:e.n||"Mentor",r:e.r});
 const nl=e.L.filter(l=>String(l[0]).trim()).length;let b="";
 if(st===1)b=`<div class="g2">${I("t","Título da mentoria",'placeholder="Ex.: Outbound B2B do zero"')}${I("cat","Categoria",'list="cats"')}<datalist id="cats">${[...new Set(M.map(m=>m.cat))].map(c=>`<option>${esc(c)}`).join("")}</datalist>${I("n","Mentor")}${I("r","Cargo do mentor")}${I("price","Preço (R$)",'type="number" min="0"')}<label class="fld">Nível<select data-e="lv">${["Iniciante","Intermediário","Avançado"].map(x=>`<option ${x===e.lv?"selected":""}>${x}</option>`).join("")}</select></label></div><label class="fld">Descrição<textarea data-e="d" rows="3" placeholder="O que o aluno vai conseguir fazer ao final?">${esc(e.d)}</textarea></label>`;
 else if(st===2)b=`<h3>Aulas</h3>${e.L.map((l,i)=>`<div class="a-r"><span class="n">${i+1}</span><input data-el="${i}" data-k="0" value="${esc(l[0])}" placeholder="Título da aula" aria-label="Título da aula ${i+1}"><input data-el="${i}" data-k="1" type="number" min="1" value="${l[1]}" aria-label="Minutos"><small>min</small><button class="a-vb ${l[2]?"on":""}" data-a="av" data-i="${i}" title="Anexar vídeo">${l[2]?"✓ vídeo":"🎬 vídeo"}</button><button data-a="rl" data-i="${i}" aria-label="Remover aula">✕</button></div>`).join("")}<button class="btn s" data-a="al">＋ Adicionar aula</button>`;
 else if(st===3)b=`<h3>Materiais para download</h3>${e.F.map((f,i)=>`<div class="a-r">${ico(f.t)}<input data-ef="${i}" data-k="n" value="${esc(f.n)}" placeholder="Nome do material" aria-label="Nome do material">${f.t==="link"?`<input data-ef="${i}" data-k="u" value="${esc(f.u||"")}" placeholder="https://…" aria-label="URL">`:`<small class="fn">${esc(f.fn||"arquivo de demonstração")}</small>`}<button data-a="rf" data-i="${i}" aria-label="Remover material">✕</button></div>`).join("")}<div class="btns"><button class="btn s" data-a="af">＋ Enviar PDF / DOCX</button><button class="btn s" data-a="alk">＋ Link</button></div>`;
 else{const ck=[[!!e.t.trim(),"Título definido"],[!!e.n.trim(),"Mentor informado"],[e.price!==""&&+e.price>=0,"Preço: "+R(+e.price||0)],[nl>0,nl+" aula(s) com título"],[e.F.length>0,e.F.length+" material(is) de apoio (opcional)"]];
  b=`<h3>Revisão</h3><div class="a-sec" style="padding:8px 18px">${ck.map(c=>`<div class="a-ln"><span class="rk ${c[0]?"f":""}">${c[0]?"✓":"–"}</span><div class="grow">${c[1]}</div></div>`).join("")}</div><p style="color:var(--steel);margin:0">Rascunhos ficam só no painel. Ao publicar, a mentoria aparece no catálogo dos alunos.</p>`}
 const live=e.id&&e.pub;
 $("#aov").innerHTML=`<div class="modal a-ed"><button class="x" data-a="xed" aria-label="Fechar">✕</button><div class="a-edh"><h2>${e.id?"Editar mentoria":"Nova mentoria"}</h2><div class="a-steps">${["Básico","Aulas","Materiais","Revisão"].map((n,i)=>`<button data-a="stp" data-s="${i+1}" aria-current="${st===i+1}" class="${st>i+1?"done":""}"><b>${st>i+1?"✓":i+1}</b>${n}</button>`).join("")}</div></div>
<div class="a-edb">${b}</div><aside class="a-pvw"><div class="cover" style="--c1:${mkC(nid)}66">${pt(0)}<b id="epv-t">${esc(e.t||"Título da mentoria")}</b></div><div class="a-pvi"><b id="epv-p">${R(+e.price||0)}</b><span id="epv-m">${esc(e.n||"Mentor")}${e.r?" · "+esc(e.r):""}</span><br>${e.lv} · ${nl} aulas</div></aside>
<div class="a-edf">${e.id?`<button class="btn s dng" data-a="del">${e.arm?"Confirmar exclusão":"Excluir"}</button>`:""}<p class="err" id="eerr" role="alert"></p>${st>1?`<button class="btn s" data-a="pv">Voltar</button>`:""}${st<4?`<button class="btn s" data-a="savd">${live?"Mover para rascunho":"Salvar rascunho"}</button><button class="btn p" data-a="nx">Continuar</button>`:`<button class="btn s" data-a="savd">${live?"Mover para rascunho":"Salvar rascunho"}</button><button class="btn p" data-a="sav">${live?"Salvar alterações":"Publicar mentoria"}</button>`}</div></div>`}
function saveEd(pb){const e=ed,er=()=>$("#eerr");
 if(!e.t.trim()){e.step=1;drawEd();er().textContent="Dê um título à mentoria.";return}
 if(!e.n.trim()){e.step=1;drawEd();er().textContent="Informe o nome do mentor.";return}
 if(e.price===""||!(+e.price>=0)){e.step=1;drawEd();er().textContent="Informe um preço válido.";return}
 const L=e.L.filter(l=>String(l[0]).trim());if(pb&&!L.length){e.step=2;drawEd();er().textContent="Adicione ao menos uma aula com título para publicar.";return}
 if(e.F.some(f=>!f.n.trim()||(f.t==="link"&&!/^https?:\/\//i.test(f.u||"")))){e.step=3;drawEd();er().textContent="Todo material precisa de nome e, se for link, de uma URL http(s).";return}
 let m=fm(e.id);if(!m){const id=Math.max(0,...M.map(x=>x.id))+1;m={id,c:mkC(id),F:[]};M.push(m);P[id]=Object.assign(mkP(id),{n:"",r:""})}
 Object.assign(m,{t:e.t.trim(),cat:e.cat.trim()||"Geral",price:+e.price,d:e.d.trim(),L:L.map(l=>[String(l[0]).trim(),(+l[1]>0?+l[1]:10)+" min",l[2],l[3]]),F:e.F,pub:pb});
 Object.assign(P[m.id],{n:e.n.trim(),r:e.r.trim()||"Mentor"});LV[m.id]=e.lv;getS(m.id);
 if(done[m.id]){done[m.id]=new Set([...done[m.id]].filter(i=>i<m.L.length));prog[m.id]=m.L.length?Math.round(done[m.id].size/m.L.length*100):0}
 closeEd();admDraw();toast(pb?"Mentoria publicada no catálogo":"Rascunho salvo")}
document.addEventListener("click",e=>{const am=$("#apm"),t=e.target.closest("[data-a]"),d=t?t.dataset:{};
 if(am&&d.a!=="apm"&&!(e.target.closest("#apm")&&!t)){am.hidden=true;const pb=document.querySelector("[data-a=apm]");if(pb)pb.setAttribute("aria-expanded","false")}
 if(!t){if(e.target.id==="aov")closeEd();return}
 switch(d.a){
 case"role":setRole(d.r);break;
 case"dl":dl(d.m,d.f);break;
 case"apm":am.hidden=!am.hidden;t.setAttribute("aria-expanded",String(!am.hidden));break;
 case"tab":aTab=d.t;pubOk=null;admDraw();$("#adm").scrollTop=0;break;
 case"fil":aFil=d.f;admDraw();break;
 case"new":openEd(0);break;case"edit":openEd(d.m);break;
 case"pubto":pubM=+d.m;pubOk=null;aTab="publicar";admDraw();$("#adm").scrollTop=0;break;
 case"pickm":pubM=+d.m;pubOk=null;admDraw();break;
 case"ptype":pubT=d.t;pubOk=null;admDraw();break;
 case"tgl":{const m=fm(d.m);if(!m)break;if(m.pub===false){if(!m.L.length){toast("Adicione ao menos uma aula antes de publicar.");break}m.pub=true;toast("“"+m.t+"” publicada no catálogo")}else{m.pub=false;toast("Movida para rascunho")}admDraw();break}
 case"rmL":{const m=fm(d.m);m.L.splice(+d.i,1);if(done[m.id]){done[m.id]=new Set([...done[m.id]].filter(i=>i<m.L.length));prog[m.id]=m.L.length?Math.round(done[m.id].size/m.L.length*100):0}admDraw();toast("Aula removida");break}
 case"rmF":{const m=fm(d.m),i=m.F.findIndex(x=>x.id==d.f);if(i>-1)m.F.splice(i,1);admDraw();toast("Material removido");break}
 case"publish":{const m=fm(pubM),n=pubTitle.trim();if(!n)return toast("Dê um título ao conteúdo.");let k;
  if(pubT==="aula"){const x=parseInt(pubDur);if(!(x>0))return toast("Informe a duração em minutos.");m.L.push([n,x+" min",pubVid?pubVid.u:undefined,pubVid?pubVid.fn:undefined]);k="Aula"}
  else if(pubT==="link"){if(!/^https?:\/\//i.test(pubUrl.trim()))return toast("Cole um link começando com http:// ou https://");m.F.push({id:++fid,t:"link",n,u:pubUrl.trim()});k="Link"}
  else{if(!pubFile)return toast("Selecione o arquivo.");m.F.push({id:++fid,t:pubFile.t,n,fn:pubFile.fn,d:pubFile.d,sz:pubFile.sz});k=FT[pubFile.t]}
  pubLog.unshift({n,k,m:m.t,w:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})});pubOk={n,m:m.id};pubTitle="";pubFile=null;pubVid=null;pubUrl="";admDraw();break}
 case"xed":closeEd();break;
 case"stp":ed.step=+d.s;drawEd();break;
 case"pv":ed.step=Math.max(1,ed.step-1);drawEd();break;
 case"nx":if(ed.step===1){if(!ed.t.trim())return $("#eerr").textContent="Dê um título à mentoria.";if(!ed.n.trim())return $("#eerr").textContent="Informe o nome do mentor.";if(ed.price===""||!(+ed.price>=0))return $("#eerr").textContent="Informe um preço válido."}ed.step++;drawEd();break;
 case"al":ed.L.push(["",15]);drawEd();break;case"rl":ed.L.splice(+d.i,1);drawEd();break;
 case"av":pickVideo(v=>{ed.L[+d.i][2]=v.u;ed.L[+d.i][3]=v.fn;drawEd()});break;
 case"rf":ed.F.splice(+d.i,1);drawEd();break;
 case"alk":ed.F.push({id:++fid,t:"link",n:"",u:""});drawEd();break;
 case"af":pickFile(f=>{ed.F.push({id:++fid,t:f.t,n:f.fn.replace(/\.[^.]+$/,""),fn:f.fn,d:f.d,sz:f.sz});drawEd()});break;
 case"savd":saveEd(false);break;case"sav":saveEd(true);break;
 case"del":if(M.length<=1)return $("#eerr").textContent="O catálogo precisa ter ao menos uma mentoria.";
  if(!ed.arm){ed.arm=1;drawEd();break}
  {const id=ed.id;M.splice(M.findIndex(x=>x.id===id),1);own.delete(id);delete prog[id];delete done[id];closeEd();admDraw();toast("Mentoria excluída")}break;
 case"prev":document.body.classList.remove("adm");document.body.classList.add("prev");view="home";document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v==="home"));render();scrollTo(0,0);break;
 case"back":document.body.classList.remove("prev");document.body.classList.add("adm");$("#ov").classList.remove("on");admDraw();break;
 case"alogout":document.body.classList.remove("adm","prev");logout();setRole("aluno");break}});
document.addEventListener("input",e=>{const i=e.target,d=i.dataset;
 if(d.a==="price"){const m=fm(d.m);if(m)m.price=Math.max(0,+i.value||0);return}
 if(i.id==="pt_"){pubTitle=i.value;const x=$("#pvt");if(x)x.textContent=i.value||(pubT==="aula"?"Título da aula":"Nome do material");return}
 if(i.id==="pd_"){pubDur=i.value;const x=$("#pvd");if(x)x.textContent=(+i.value||0)+" min";return}
 if(i.id==="pu_"){pubUrl=i.value;return}
 if(i.id==="bn")BUMP.n=i.value;else if(i.id==="bp")BUMP.p=Math.max(0,+i.value||0);else if(i.id==="bd")BUMP.d=i.value;
 else if(i.id==="cd2")COUPON.code=i.value.trim().toUpperCase()||"CUPOM";else if(i.id==="cp2")COUPON.pct=Math.min(100,Math.max(0,+i.value||0));
 if(!ed)return;
 if(d.e)ed[d.e]=i.value;else if(d.el!==undefined)ed.L[d.el][d.k]=i.value;else if(d.ef!==undefined)ed.F[d.ef][d.k]=i.value;
 updPv()});
document.addEventListener("change",e=>{const i=e.target;
 if(i.id==="fv"){const f=i.files[0];if(f){pubVid={fn:f.name,u:URL.createObjectURL(f),sz:f.size};admDraw()}return}
 if(i.id==="fz"){const f=i.files[0];if(!f)return;if(f.size>8e6){toast("Arquivo acima de 8 MB.");i.value="";return}const r=new FileReader();r.onload=()=>{pubFile={fn:f.name,d:r.result,sz:f.size,t:/\.pdf$/i.test(f.name)?"pdf":"doc"};if(!pubTitle)pubTitle=f.name.replace(/\.[^.]+$/,"");admDraw()};r.readAsDataURL(f);return}
 if(i.dataset.a==="price"||/^(bn|bp|bd|cd2|cp2)$/.test(i.id))toast("Valores atualizados")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(ed)closeEd();const am=$("#apm");if(am)am.hidden=true}});
if (location.hash === "#cadastro") $("#lswb").click();
