<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11171C"/>
      <stop offset="1" stop-color="#070A0D"/>
    </linearGradient>
    <linearGradient id="accent" x1="480" y1="220" x2="1200" y2="820" gradientUnits="userSpaceOnUse">
