    <text x="150" y="325" font-size="30" fill="#F4F5F4">Dados comerciais</text>
    <text x="150" y="475" font-size="18" letter-spacing="3">CONTEXTO</text>
    <text x="150" y="525" font-size="30" fill="#F4F5F4">CRM e pipeline</text>
